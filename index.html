<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Elite Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = FramerMotion;

        function App() {
            const [view, setView] = useState('dashboard');
            const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('tf_tasks')) || []);
            const [events, setEvents] = useState(() => JSON.parse(localStorage.getItem('tf_events')) || []);

            useEffect(() => {
                localStorage.setItem('tf_tasks', JSON.stringify(tasks));
                localStorage.setItem('tf_events', JSON.stringify(events));
                lucide.createIcons();
            }, [tasks, events]);

            return (
                <div className="max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col relative overflow-hidden">
                    <header className="p-6 pt-10 flex justify-between items-center">
                        <div>
                            <p className="text-sm text-gray-500 font-medium">Good evening,</p>
                            <h1 className="text-2xl font-bold text-gray-900">Mason</h1>
                        </div>
                        <img src="download.jpg" className="w-10 h-10 rounded-full object-cover border-2 border-blue-500" />
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 pb-24">
                        {view === 'dashboard' && <Dashboard tasks={tasks} />}
                        {view === 'tasks' && <TasksView tasks={tasks} setTasks={setTasks} />}
                        {view === 'calendar' && <CalendarView events={events} setEvents={setEvents} />}
                        {view === 'focus' && <FocusView />}
                    </main>

                    <nav className="absolute bottom-4 left-4 right-4 glass rounded-3xl p-3 flex justify-around border shadow-lg z-50">
                        {['dashboard', 'tasks', 'calendar', 'focus'].map(tab => (
                            <button key={tab} onClick={() => setView(tab)} className={`p-3 rounded-full ${view === tab ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>
                                <i data-lucide={tab === 'dashboard' ? 'home' : tab === 'tasks' ? 'check-square' : tab === 'calendar' ? 'calendar' : 'timer'}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        function Dashboard({ tasks }) {
            const dueToday = tasks.filter(t => !t.completed).length;
            return (
                <div className="space-y-6">
                    <div className="bg-blue-600 rounded-3xl p-6 text-white shadow-xl shadow-blue-200">
                        <h2 className="text-lg font-semibold mb-2">You're on track! 🔥</h2>
                        <div className="h-2 bg-blue-400 rounded-full w-full overflow-hidden">
                            <div className="h-full bg-white w-2/3"></div>
                        </div>
                        <p className="mt-2 text-sm opacity-80">{dueToday} tasks remaining for today</p>
                    </div>
                </div>
            );
        }

        function TasksView({ tasks, setTasks }) {
            const add = () => {
                const title = prompt("Task title?");
                if(title) setTasks([...tasks, { id: Date.now(), title, completed: false }]);
            };
            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold">Assignments</h2>
                        <button onClick={add} className="bg-blue-600 text-white p-2 rounded-full"><i data-lucide="plus"></i></button>
                    </div>
                    {tasks.map(t => (
                        <div key={t.id} className="p-4 border rounded-2xl mb-3 flex items-center justify-between">
                            <span>{t.title}</span>
                            <button onClick={() => setTasks(tasks.filter(x => x.id !== t.id))} className="text-red-400"><i data-lucide="trash"></i></button>
                        </div>
                    ))}
                </div>
            );
        }

        function CalendarView({ events, setEvents }) {
            const addEvent = () => {
                const title = prompt("Event name?");
                if(title) setEvents([...events, { id: Date.now(), title }]);
            };
            return (
                <div>
                    <h2 className="text-xl font-bold mb-4">Calendar</h2>
                    <button onClick={addEvent} className="w-full py-3 border-2 border-dashed rounded-xl mb-4 text-gray-400">+ Add Event</button>
                    {events.map(e => (
                        <div key={e.id} className="p-3 bg-gray-50 rounded-lg mb-2">{e.title}</div>
                    ))}
                </div>
            );
        }

        function FocusView() {
            const [time, setTime] = useState(25 * 60);
            const [active, setActive] = useState(false);
            useEffect(() => {
                if(active && time > 0) setTimeout(() => setTime(time - 1), 1000);
            }, [active, time]);

            return (
                <div className="flex flex-col items-center justify-center pt-10">
                    <div className="w-48 h-48 rounded-full border-8 border-blue-500 flex items-center justify-center text-3xl font-bold">
                        {Math.floor(time/60)}:{String(time%60).padStart(2,'0')}
                    </div>
                    <button onClick={() => setActive(!active)} className="mt-8 px-8 py-3 bg-black text-white rounded-full">
                        {active ? "Pause" : "Start Session"}
                    </button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
