<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Premium Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .gradient-bg { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('dashboard');
            const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('tf_tasks')) || []);
            const [events, setEvents] = useState(() => JSON.parse(localStorage.getItem('tf_events')) || []);
            const [pomodoro, setPomodoro] = useState({ active: false, time: 1500 });

            useEffect(() => {
                localStorage.setItem('tf_tasks', JSON.stringify(tasks));
                localStorage.setItem('tf_events', JSON.stringify(events));
                lucide.createIcons();
            }, [tasks, events]);

            return (
                <div className="max-w-md mx-auto h-screen bg-slate-50 flex flex-col relative shadow-2xl">
                    <header className="p-6 pt-12 flex justify-between items-center bg-white">
                        <div>
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Welcome back</p>
                            <h1 className="text-2xl font-extrabold text-slate-900">Hey, Mason</h1>
                        </div>
                        <img src="download.jpg" className="w-12 h-12 rounded-full border-2 border-blue-100 shadow-sm object-cover" />
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 py-4">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="gradient-bg rounded-3xl p-6 text-white shadow-lg">
                                    <h2 className="text-sm opacity-90">Progress</h2>
                                    <p className="text-2xl font-bold mb-4">{Math.round((tasks.filter(t => t.completed).length / (tasks.length || 1)) * 100)}% Complete</p>
                                    <div className="w-full bg-white/20 h-2 rounded-full"><div className="bg-white h-2 rounded-full" style={{width: '60%'}}></div></div>
                                </div>
                                <h3 className="font-bold text-lg">Today's Tasks</h3>
                                {tasks.slice(0, 3).map(t => <div key={t.id} className="bg-white p-4 rounded-2xl border shadow-sm font-medium">{t.title}</div>)}
                            </div>
                        )}
                        {view === 'tasks' && <TasksView tasks={tasks} setTasks={setTasks} />}
                        {view === 'calendar' && <CalendarView events={events} setEvents={setEvents} />}
                        {view === 'focus' && <FocusView />}
                    </main>

                    <nav className="absolute bottom-6 left-6 right-6 glass rounded-3xl p-2 flex justify-around border border-white/50 shadow-xl z-50">
                        {['dashboard', 'tasks', 'calendar', 'focus'].map(tab => (
                            <button key={tab} onClick={() => setView(tab)} className={`p-4 rounded-2xl transition-all ${view === tab ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>
                                <i data-lucide={tab === 'dashboard' ? 'home' : tab === 'tasks' ? 'check-square' : tab === 'calendar' ? 'calendar' : 'timer'}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        function TasksView({ tasks, setTasks }) {
            const add = () => {
                const title = prompt("New assignment:");
                if(title) setTasks([...tasks, { id: Date.now(), title, completed: false }]);
            };
            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">Assignments</h2><button onClick={add} className="bg-blue-600 text-white p-2 rounded-xl">+</button></div>
                    {tasks.map(t => (
                        <div key={t.id} className="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm">
                            <span>{t.title}</span>
                            <button onClick={() => setTasks(tasks.filter(x => x.id !== t.id))} className="text-red-400">×</button>
                        </div>
                    ))}
                </div>
            );
        }

        function CalendarView({ events, setEvents }) {
            const addEvent = () => {
                const title = prompt("Event title:");
                const date = prompt("Date (e.g., May 2nd):");
                if(title && date) setEvents([...events, { id: Date.now(), title, date }]);
            };
            return (
                <div className="space-y-4">
                    <h2 className="text-xl font-bold">Calendar</h2>
                    <button onClick={addEvent} className="w-full py-4 border-2 border-dashed rounded-2xl text-slate-400 text-sm font-semibold">+ Add Calendar Event</button>
                    {events.map(e => <div key={e.id} className="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-blue-500 font-semibold">{e.title} <span className="text-slate-400 text-sm ml-2">({e.date})</span></div>)}
                </div>
            );
        }

        function FocusView() {
            const [time, setTime] = useState(1500);
            const [active, setActive] = useState(false);
            useEffect(() => { if(active && time > 0) setTimeout(() => setTime(time - 1), 1000); }, [active, time]);
            return (
                <div className="flex flex-col items-center justify-center pt-10">
                    <div className="w-64 h-64 rounded-full border-[16px] border-blue-100 flex items-center justify-center text-5xl font-extrabold text-blue-600 mb-8 shadow-inner">
                        {Math.floor(time/60)}:{String(time%60).padStart(2,'0')}
                    </div>
                    <button onClick={() => setActive(!active)} className="px-10 py-4 bg-slate-900 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-slate-800 transition">
                        {active ? "Pause Timer" : "Start Focus Session"}
                    </button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
