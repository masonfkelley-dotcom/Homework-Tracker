<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Premium Homework App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F8FAFC; 
            color: #0F172A;
            -webkit-tap-highlight-color: transparent;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
        }
        .gradient-brand { 
            background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%); 
        }
        .gradient-text {
            background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { display: none; }
        .slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // --- GLOBAL PERSISTENT STATE ---
            const [view, setView] = useState('dashboard');
            const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('tf_tasks')) || []);
            const [events, setEvents] = useState(() => JSON.parse(localStorage.getItem('tf_events')) || []);
            const [xp, setXp] = useState(() => JSON.parse(localStorage.getItem('tf_xp')) || 0);
            
            // Focus Timer Global State
            const [focusSetting, setFocusSetting] = useState(25); 

            useEffect(() => {
                localStorage.setItem('tf_tasks', JSON.stringify(tasks));
                localStorage.setItem('tf_events', JSON.stringify(events));
                localStorage.setItem('tf_xp', JSON.stringify(xp));
                if (window.lucide) window.lucide.createIcons();
            }, [tasks, events, xp, view]);

            // --- COMPUTED VALUES ---
            const currentLevel = Math.floor(xp / 100) + 1;
            const xpToNextLevel = xp % 100;

            const todayStr = new Date().toISOString().split('T')[0];
            const activeTasks = tasks.filter(t => !t.completed);
            const completedTasksCount = tasks.filter(t => t.completed).length;
            const dailyCompletionRate = tasks.length > 0 ? Math.round((completedTasksCount / tasks.length) * 100) : 0;

            // --- ACTIONS ---
            const addTask = (newTask) => {
                const createdTask = {
                    id: Date.now(),
                    title: newTask.title,
                    subject: newTask.subject || 'General',
                    dueDate: newTask.dueDate || todayStr,
                    priority: newTask.priority || 'Medium',
                    estimatedTime: newTask.estimatedTime || 30,
                    completed: false
                };
                setTasks(prev => [...prev, createdTask]);
            };

            const toggleTask = (taskId) => {
                setTasks(prev => prev.map(t => {
                    if (t.id === taskId) {
                        const nextState = !t.completed;
                        if (nextState) {
                            setXp(x => x + 20);
                            confetti({ particleCount: 60, spread: 50, origin: { y: 0.8 }, colors: ['#2563EB', '#7C3AED'] });
                        } else {
                            setXp(x => Math.max(0, x - 20));
                        }
                        return { ...t, completed: nextState };
                    }
                    return t;
                }));
            };

            const deleteTask = (taskId) => {
                setTasks(prev => prev.filter(t => t.id !== taskId));
            };

            const addEvent = (newEvent) => {
                const createdEvent = {
                    id: Date.now(),
                    title: newEvent.title,
                    date: newEvent.date || todayStr,
                    time: newEvent.time || '12:00 PM',
                    duration: newEvent.duration || 60
                };
                setEvents(prev => [...prev, createdEvent]);
            };

            const deleteEvent = (eventId) => {
                setEvents(prev => prev.filter(e => e.id !== eventId));
            };

            return (
                <div className="max-w-md mx-auto h-screen flex flex-col bg-slate-50 relative overflow-hidden lg:shadow-2xl lg:rounded-3xl lg:h-[92vh] lg:my-[4vh] lg:border lg:border-slate-200">
                    
                    {/* Top Native-Style Header Bar */}
                    <header className="pt-10 pb-5 px-6 glass rounded-b-[2rem] z-20 sticky top-0 border-b border-slate-100 flex flex-col gap-4">
                        <div className="flex justify-between items-center">
                            <div>
                                <p className="text-xs font-bold tracking-widest text-slate-400 uppercase">TaskFlow Premium</p>
                                <h1 className="text-2xl font-extrabold tracking-tight text-slate-800">Hey, Mason</h1>
                            </div>
                            <div className="relative">
                                <img src="download.jpg" alt="Profile" className="w-12 h-12 rounded-full border-2 border-white shadow-md object-cover" onerror="this.src='https://ui-avatars.com/api/?name=Mason&background=2563EB&color=fff'" />
                                <div className="absolute -bottom-1 -right-1 bg-amber-400 text-slate-900 text-[10px] font-black px-1.5 py-0.5 rounded-full border border-white shadow-sm">
                                    Lvl {currentLevel}
                                </div>
                            </div>
                        </div>
                        {/* Interactive Level Meter */}
                        <div className="flex items-center space-x-3">
                            <div className="flex-1 h-2.5 bg-slate-200/80 rounded-full overflow-hidden shadow-inner">
                                <div className="h-full gradient-brand transition-all duration-700 ease-out shadow-sm" style={{ width: `${xpToNextLevel}%` }}></div>
                            </div>
                            <span className="text-xs font-bold text-slate-400 select-none">{xpToNextLevel}/100 XP</span>
                        </div>
                    </header>

                    {/* Content Section */}
                    <main className="flex-1 overflow-y-auto px-6 py-5 pb-28">
                        {view === 'dashboard' && (
                            <DashboardView 
                                activeTasks={activeTasks} 
                                dailyCompletionRate={dailyCompletionRate} 
                                toggleTask={toggleTask}
                                setView={setView}
                            />
                        )}
                        {view === 'tasks' && (
                            <TasksView 
                                tasks={tasks} 
                                addTask={addTask} 
                                toggleTask={toggleTask} 
                                deleteTask={deleteTask} 
                            />
                        )}
                        {view === 'calendar' && (
                            <CalendarView 
                                events={events} 
                                addEvent={addEvent} 
                                deleteEvent={deleteEvent}
                            />
                        )}
                        {view === 'focus' && (
                            <FocusView 
                                focusSetting={focusSetting} 
                                setFocusSetting={setFocusSetting} 
                            />
                        )}
                        {view === 'profile' && (
                            <ProfileView 
                                xp={xp} 
                                totalTasks={tasks.length} 
                                completedTasksCount={completedTasksCount}
                            />
                        )}
                    </main>

                    {/* Luxury Mobile Navigation Bar */}
                    <nav className="absolute bottom-5 left-4 right-4 glass rounded-2xl p-2.5 flex justify-between items-center shadow-lg border border-slate-200/60 z-50">
                        <NavItem icon="home" label="Dashboard" isActive={view === 'dashboard'} onClick={() => setView('dashboard')} />
                        <NavItem icon="check-square" label="Tasks" isActive={view === 'tasks'} onClick={() => setView('tasks')} />
                        <NavItem icon="calendar" label="Calendar" isActive={view === 'calendar'} onClick={() => setView('calendar')} />
                        <NavItem icon="timer" label="Focus" isActive={view === 'focus'} onClick={() => setView('focus')} />
                        <NavItem icon="user" label="Profile" isActive={view === 'profile'} onClick={() => setView('profile')} />
                    </nav>
                </div>
            );
        }

        const NavItem = ({ icon, label, isActive, onClick }) => (
            <div onClick={onClick} className={`flex flex-col items-center justify-center w-14 h-14 rounded-xl cursor-pointer transition-all duration-300 ${isActive ? 'bg-blue-50 text-blue-600 shadow-sm' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-100/50'}`}>
                <i data-lucide={icon} className={`w-5 h-5 mb-1 ${isActive ? 'stroke-[2.5]' : 'stroke-2'}`}></i>
                <span className="text-[9px] font-bold tracking-wide select-none">{label}</span>
            </div>
        );

        // --- DASHBOARD VIEW ---
        const DashboardView = ({ activeTasks, dailyCompletionRate, toggleTask, setView }) => (
            <div className="space-y-6 slide-up">
                <div className="glass p-6 rounded-2xl relative overflow-hidden border-none shadow-sm flex flex-col gap-4">
                    <div className="flex justify-between items-start">
                        <div>
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">Focus Summary</h2>
                            <p className="text-3xl font-extrabold text-slate-800 tracking-tight">
                                {dailyCompletionRate === 100 ? "Ready for Rest 🎉" : "Ready to Move"}
                            </p>
                        </div>
                        <span className="text-3xl">🔥</span>
                    </div>
                    <div>
                        <div className="w-full bg-slate-200 rounded-full h-3.5 shadow-inner overflow-hidden">
                            <div className="gradient-brand h-full rounded-full transition-all duration-1000 ease-out" style={{ width: `${dailyCompletionRate}%` }}></div>
                        </div>
                        <div className="flex justify-between mt-2 text-xs font-bold text-slate-400">
                            <span>Completeness Rate</span>
                            <span>{dailyCompletionRate}%</span>
                        </div>
                    </div>
                </div>

                <div className="flex justify-between items-center mb-1">
                    <h3 className="text-lg font-bold text-slate-800 flex items-center">
                        <i data-lucide="zap" className="w-4 h-4 text-amber-500 mr-2"></i> Current Goals
                    </h3>
                    <span onClick={() => setView('tasks')} className="text-xs font-bold tracking-wide text-blue-600 cursor-pointer">All tasks</span>
                </div>

                {activeTasks.length === 0 ? (
                    <div className="text-center py-10 glass rounded-2xl border-dashed border-2 border-slate-200">
                        <div className="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="sparkles" className="w-6 h-6 text-blue-500"></i>
                        </div>
                        <p className="text-slate-700 font-bold">No items remaining</p>
                        <p className="text-slate-400 text-xs mt-0.5">Start fresh or add your homework items.</p>
                    </div>
                ) : (
                    <div className="space-y-3">
                        {activeTasks.slice(0, 4).map(task => (
                            <TaskCard key={task.id} task={task} toggleTask={toggleTask} />
                        ))}
                    </div>
                )}
            </div>
        );

        // --- TASKS VIEW ---
        const TasksView = ({ tasks, addTask, toggleTask, deleteTask }) => {
            const [isAdding, setIsAdding] = useState(false);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                addTask({
                    title: formData.get('title'),
                    subject: formData.get('subject'),
                    dueDate: formData.get('dueDate'),
                    priority: formData.get('priority'),
                    estimatedTime: parseInt(formData.get('estimatedTime'))
                });
                setIsAdding(false);
            };

            if (isAdding) {
                return (
                    <div className="slide-up space-y-4">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-black text-slate-800">New Assignment</h2>
                            <button onClick={() => setIsAdding(false)} className="text-slate-400 hover:text-slate-700">
                                <i data-lucide="x" className="w-6 h-6"></i>
                            </button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4 bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                            <div>
                                <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Task Description</label>
                                <input required name="title" type="text" className="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="e.g., Read Physics Chapter 4" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Subject</label>
                                    <input required name="subject" type="text" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="e.g., Science" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Priority</label>
                                    <select name="priority" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition">
                                        <option value="Low">Low</option>
                                        <option value="Medium">Medium</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Due Date</label>
                                    <input required name="dueDate" type="date" min={new Date().toISOString().split('T')[0]} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Mins Needed</label>
                                    <input required name="estimatedTime" type="number" min="5" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="60" />
                                </div>
                            </div>
                            <button type="submit" className="w-full mt-4 py-3.5 rounded-xl font-bold gradient-brand text-white shadow-lg shadow-blue-500/25 active:scale-95 hover:brightness-110 transition duration-200">
                                Create Assignment
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="slide-up space-y-4">
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800">Assignments</h2>
                            <p className="text-xs font-medium text-slate-400">{tasks.length} items logged</p>
                        </div>
                        <button onClick={() => setIsAdding(true)} className="gradient-brand w-11 h-11 rounded-full flex items-center justify-center shadow-md shadow-blue-500/30 hover:scale-105 active:scale-95 transition duration-200">
                            <i data-lucide="plus" className="text-white w-5 h-5"></i>
                        </button>
                    </div>
                    {tasks.length === 0 ? (
                        <div className="text-center p-8 text-slate-400">Add a task to get started.</div>
                    ) : (
                        <div className="space-y-3">
                            {tasks.map(task => (
                                <TaskCard key={task.id} task={task} toggleTask={toggleTask} deleteTask={deleteTask} showControls />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const TaskCard = ({ task, toggleTask, deleteTask, showControls }) => (
            <div className={`p-4 bg-white rounded-2xl flex items-center justify-between border border-slate-100 transition duration-300 shadow-sm ${task.completed ? 'opacity-60 bg-slate-50/80' : 'hover:shadow-md'}`}>
                <div onClick={() => toggleTask(task.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 transition duration-200 cursor-pointer flex-shrink-0 ${task.completed ? 'bg-blue-500 border-blue-500 shadow-blue-500/40' : 'border-slate-300 hover:border-blue-500'}`}>
                    {task.completed && <i data-lucide="check" className="w-3.5 h-3.5 text-white"></i>}
                </div>
                <div className="flex-1 min-w-0 pr-2">
                    <h4 className={`font-bold text-sm truncate ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{task.title}</h4>
                    <div className="flex items-center text-[10px] font-bold text-slate-400 mt-1 space-x-2">
                        <span className="bg-slate-100 px-2 py-0.5 rounded text-blue-600 font-bold select-none">{task.subject}</span>
                        <span>•</span>
                        <span className={new Date(task.dueDate) <= new Date() ? 'text-red-500' : ''}>Due {task.dueDate}</span>
                    </div>
                </div>
                <div className="flex items-center space-x-2 flex-shrink-0">
                    <span className={`px-2 py-1 rounded-lg text-xs font-bold ${task.completed ? 'bg-slate-100 text-slate-400' : 'bg-blue-50 text-blue-600'}`}>
                        {task.estimatedTime}m
                    </span>
                    {showControls && (
                        <button onClick={() => deleteTask(task.id)} className="p-2 text-slate-300 hover:text-red-500 transition duration-200">
                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                        </button>
                    )}
                </div>
            </div>
        );

        // --- CALENDAR VIEW ---
        const CalendarView = ({ events, addEvent, deleteEvent }) => {
            const [isAdding, setIsAdding] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                addEvent({
                    title: formData.get('title'),
                    date: formData.get('date'),
                    time: formData.get('time'),
                    duration: parseInt(formData.get('duration'))
                });
                setIsAdding(false);
            };

            return (
                <div className="slide-up space-y-4">
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800">Schedule</h2>
                            <p className="text-xs font-medium text-slate-400">Events & commitments</p>
                        </div>
                        <button onClick={() => setIsAdding(!isAdding)} className="gradient-brand w-11 h-11 rounded-full flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition duration-200">
                            <i data-lucide={isAdding ? "x" : "plus"} className="text-white w-5 h-5"></i>
                        </button>
                    </div>

                    {isAdding && (
                        <form onSubmit={handleSubmit} className="p-5 bg-white border border-slate-100 rounded-2xl shadow-sm space-y-4 mb-4">
                            <div>
                                <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Event Title</label>
                                <input required name="title" type="text" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:border-blue-500 focus:ring-1 outline-none text-slate-800 text-sm" placeholder="e.g. Study Session" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Date</label>
                                    <input required name="date" type="date" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:border-blue-500 outline-none text-slate-800 text-sm" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Start Time</label>
                                    <input required name="time" type="time" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:border-blue-500 outline-none text-slate-800 text-sm" />
                                </div>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Length (minutes)</label>
                                <input required name="duration" type="number" min="5" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:border-blue-500 outline-none text-slate-800 text-sm" placeholder="60" />
                            </div>
                            <button type="submit" className="w-full py-3.5 mt-2 font-bold gradient-brand text-white rounded-xl shadow shadow-blue-500/25 active:scale-95 transition">
                                Create Event
                            </button>
                        </form>
                    )}

                    {events.length === 0 ? (
                        <div className="text-center p-8 text-slate-400">No scheduled events yet.</div>
                    ) : (
                        <div className="space-y-3">
                            {events.map(event => (
                                <div key={event.id} className="p-4 bg-white border border-slate-100 rounded-2xl flex justify-between items-center shadow-sm">
                                    <div className="flex items-center space-x-3.5">
                                        <div className="w-1.5 h-10 bg-blue-500 rounded-full"></div>
                                        <div>
                                            <h4 className="font-bold text-slate-800 text-sm">{event.title}</h4>
                                            <p className="text-xs font-bold text-slate-400 mt-1 flex items-center">
                                                <i data-lucide="clock" className="w-3.5 h-3.5 mr-1 text-slate-300"></i> {event.date} at {event.time}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xs bg-slate-50 text-slate-500 px-2 py-1 rounded font-bold border border-slate-100">{event.duration}m</span>
                                        <button onClick={() => deleteEvent(event.id)} className="p-1.5 text-slate-300 hover:text-red-500 transition">
                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // --- FOCUS TIMER VIEW ---
        const FocusView = ({ focusSetting, setFocusSetting }) => {
            const [timeLeft, setTimeLeft] = useState(focusSetting * 60);
            const [isActive, setIsActive] = useState(false);

            useEffect(() => {
                setTimeLeft(focusSetting * 60);
            }, [focusSetting]);

            useEffect(() => {
                let timer = null;
                if (isActive && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                }
                return () => clearInterval(timer);
            }, [isActive, timeLeft]);

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const progressValue = ((focusSetting * 60 - timeLeft) / (focusSetting * 60)) * 100;

            return (
                <div className="slide-up flex flex-col items-center justify-center h-full pt-4">
                    <h2 className="text-2xl font-black text-slate-800 mb-2">Focus Mode</h2>
                    <p className="text-xs text-slate-400 font-bold mb-6">Complete focused deep work sessions</p>

                    <div className="flex items-center space-x-3 mb-8 bg-white border border-slate-200/60 p-1.5 rounded-2xl shadow-sm">
                        {[15, 25, 45, 60].map(duration => (
                            <button key={duration} onClick={() => { setFocusSetting(duration); setIsActive(false); }} className={`px-4 py-2 font-black rounded-xl text-xs transition duration-200 ${focusSetting === duration ? 'gradient-brand text-white shadow-sm' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-700'}`}>
                                {duration}m
                            </button>
                        ))}
                    </div>

                    <div className="relative w-64 h-64 flex items-center justify-center bg-white border-2 border-slate-100 rounded-full shadow-lg mb-10">
                        <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                            <circle cx="128" cy="128" r="118" fill="none" stroke="#F1F5F9" strokeWidth="8" />
                            <circle cx="128" cy="128" r="118" fill="none" stroke="url(#timerGradient)" strokeWidth="8" strokeDasharray="741.4" strokeDashoffset={741.4 - (741.4 * progressValue) / 100} strokeLinecap="round" className="transition-all duration-1000 ease-linear" />
                            <defs>
                                <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#2563EB" />
                                    <stop offset="100%" stopColor="#7C3AED" />
                                </linearGradient>
                            </defs>
                        </svg>

                        <div className="text-center z-10 flex flex-col">
                            <span className="text-6xl font-black tracking-tighter text-slate-800">
                                {minutes.toString().padStart(2, '0')}:{seconds.toString().padStart(2, '0')}
                            </span>
                            <span className="text-xs font-bold text-slate-400 tracking-wider uppercase mt-1">Countdown</span>
                        </div>
                    </div>

                    <div className="flex space-x-3 w-full px-2">
                        <button onClick={() => setIsActive(!isActive)} className="flex-1 py-4 font-black rounded-2xl gradient-brand text-white shadow-lg shadow-blue-500/25 active:scale-95 transition-all text-base">
                            {isActive ? 'Pause timer' : 'Start working'}
                        </button>
                        <button onClick={() => { setIsActive(false); setTimeLeft(focusSetting * 60); }} className="px-5 py-4 font-black rounded-2xl bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 active:scale-95 transition">
                            <i data-lucide="rotate-ccw" className="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            );
        };

        // --- PROFILE VIEW ---
        const ProfileView = ({ xp, totalTasks, completedTasksCount }) => (
            <div className="slide-up space-y-6">
                <div className="flex items-center space-x-4 mb-4">
                    <img src="download.jpg" className="w-16 h-16 rounded-full border-2 border-blue-500 shadow-sm object-cover" onerror="this.src='https://ui-avatars.com/api/?name=Mason&background=2563EB&color=fff'" />
                    <div>
                        <h2 className="text-2xl font-black text-slate-800">Mason</h2>
                        <p className="text-xs text-slate-400 font-medium">Power Student</p>
                    </div>
                </div>
                <div className="grid grid-cols-2 gap-3.5">
                    <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <p className="text-2xl font-black text-blue-600">{xp} XP</p>
                        <p className="text-xs font-bold text-slate-400 mt-1 uppercase">Total score</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <p className="text-2xl font-black text-purple-600">{completedTasksCount}/{totalTasks}</p>
                        <p className="text-xs font-bold text-slate-400 mt-1 uppercase">Goals hit</p>
                    </div>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-700 mb-4 uppercase tracking-wider">Account Control</h3>
                    <div className="space-y-2 text-sm text-slate-600">
                        <div className="py-3 flex justify-between items-center cursor-pointer border-b border-slate-50">
                            <span className="font-semibold">Email</span>
                            <span className="text-slate-400 font-medium">mason@taskflow.dev</span>
                        </div>
                        <div className="py-3 flex justify-between items-center cursor-pointer">
                            <span className="font-semibold">Privacy Agreement</span>
                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- RENDER APP ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
